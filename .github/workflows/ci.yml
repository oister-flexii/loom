name: Linux verification

on:
  pull_request:
  push:
    branches: ["**"]
    tags: ["**"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - name: Required Linux tools
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          test "$(uname -s)" = Linux
          test "$BASH_VERSINFO" -ge 4
          for tool in jq bash git timeout node npm bun; do
            command -v "$tool"
          done
          test "$(node --version)" = v22.23.2
          test "$(bun --version)" = 1.3.13
          jq --version
          git --version
          timeout --version
      - name: Install both locked dependency graphs
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          (cd engine && bun install --frozen-lockfile)
      - name: Require locked local compiler, Vitest, and Pi
        shell: bash
        run: |
          set -euo pipefail
          test -f engine/node_modules/typescript/lib/typescript.js
          test -x engine/node_modules/.bin/vitest
          test -x node_modules/.bin/pi
          export PATH="$GITHUB_WORKSPACE/node_modules/.bin:$PATH"
          test "$(command -v pi)" = "$GITHUB_WORKSPACE/node_modules/.bin/pi"
          printf '%s\n' "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
          node -p 'require("./engine/node_modules/typescript/package.json").version'
          node -p 'require("./node_modules/@earendil-works/pi-coding-agent/package.json").version'
      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          npm run verify 2>&1 | tee verification.log
      - name: Retain verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-verification-log
          path: verification.log
          if-no-files-found: warn
